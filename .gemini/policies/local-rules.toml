# Format: Gemini CLI policy engine (verify keys against your Gemini CLI version).
# Read-only commands that never need validation. Never whitelist glab (use gitlab_cli).
[[rule]]
toolName = "run_shell_command"
commandPrefix = ["git status", "git log", "git diff", "./iris tokens report", "./iris usage audit", "./iris repos status", "./iris context", "./iris fr list"]
decision = "allow"
priority = 100
